services:
  # Express Backend Web Service
  - type: web
    name: mediroute-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  # Next.js Frontend Web Service
  - type: web
    name: mediroute-web
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://mediroute-api-vw0l.onrender.com/api
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
