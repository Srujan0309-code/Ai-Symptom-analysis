services:
  # Express Backend Web Service
  - type: web
    name: mediroute-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
        default: ""
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
        default: ""

  # Next.js Frontend Web Service
  - type: web
    name: mediroute-web
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        default: https://mediroute-api.onrender.com/api
